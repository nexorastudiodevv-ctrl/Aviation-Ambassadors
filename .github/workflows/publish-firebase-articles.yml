name: Publish Firebase articles

on:
  workflow_dispatch:
    inputs:
      triggeredBy:
        description: Source that requested the publishing run
        required: false
        type: string
        default: manual
      articleSlug:
        description: Slug of the article that was published
        required: false
        type: string
        default: ""
      articleStatus:
        description: Current article status
        required: false
        type: string
        default: ""
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: publish-firebase-articles
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PAGES_PUBLISH_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check publishing credentials
        id: credentials
        env:
          PAGES_PUBLISH_TOKEN: ${{ secrets.PAGES_PUBLISH_TOKEN }}
        run: |
          if [ -z "$PAGES_PUBLISH_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add PAGES_PUBLISH_TOKEN repository secret to enable publishing."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.credentials.outputs.configured == 'true'
        run: npm ci

      - name: Generate published article pages
        if: steps.credentials.outputs.configured == 'true'
        run: npm run build:articles

      - name: Commit generated site
        if: steps.credentials.outputs.configured == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/blog.html pages/articles sitemap.xml
          if git diff --cached --quiet; then
            echo "No published Firebase article changes."
            exit 0
          fi
          git commit -m "Publish articles from Firebase"
          git push origin HEAD:main
